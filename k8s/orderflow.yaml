apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
  namespace: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: userservice
  template:
    metadata:
      labels:
        app: userservice
    spec:
      containers:
        - name: userservice
          image: userservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: orderflow-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: categoryservice
  namespace: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: categoryservice
  template:
    metadata:
      labels:
        app: categoryservice
    spec:
      containers:
        - name: categoryservice
          image: categoryservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: orderflow-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogservice
  namespace: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogservice
  template:
    metadata:
      labels:
        app: catalogservice
    spec:
      containers:
        - name: catalogservice
          image: catalogservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: orderflow-config
          env:
            - name: Services__CategoryService__BaseUrl
              value: "http://categoryservice:8080/"
            - name: Services__CatalogService__BaseUrl
              value: "http://catalogservice:8080/"
            - name: CategoryService__BaseUrl
              value: "http://categoryservice:8080/"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
  namespace: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cartservice
  template:
    metadata:
      labels:
        app: cartservice
    spec:
      containers:
        - name: cartservice
          image: cartservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: orderflow-config
          env:
            - name: Services__CatalogService__BaseUrl
              value: "http://catalogservice:8080/"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventoryservice
  namespace: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventoryservice
  template:
    metadata:
      labels:
        app: inventoryservice
    spec:
      containers:
        - name: inventoryservice
          image: inventoryservice:latest
          imagePullPolicy: Never
          ports:
            - name: grpc
              containerPort: 8080
          envFrom:
            - secretRef:
                name: orderflow-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderservice
  namespace: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderservice
  template:
    metadata:
      labels:
        app: orderservice
    spec:
      containers:
        - name: orderservice
          image: orderservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: orderflow-config
          env:
            - name: Services__CatalogService__BaseUrl
              value: "http://catalogservice:8080/"
            - name: Services__CategoryService__BaseUrl
              value: "http://categoryservice:8080/"
            - name: InventoryService__Url
              value: "http://inventoryservice:8080/"
            - name: CartService__BaseUrl
              value: "http://cartservice:8080/"
            - name: CatalogService__BaseUrl
              value: "http://catalogservice:8080/"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
  namespace: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paymentservice
  template:
    metadata:
      labels:
        app: paymentservice
    spec:
      containers:
        - name: paymentservice
          image: paymentservice:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: orderflow-config
---
apiVersion: v1
kind: Service
metadata:
  name: userservice
  namespace: orderflow
spec:
  type: NodePort
  selector:
    app: userservice
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30101
---
